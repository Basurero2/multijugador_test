<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Explorador 16x16 MMO</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevenir scroll y zoom en móviles */
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        #coords {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        #status {
            position: absolute;
            top: 50px;
            left: 20px;
            font-size: 0.8rem;
            color: #888;
        }

        /* AJUSTE: Movido debajo de "Conectado" (#status) y alineado a la izquierda */
        #player-stats {
            position: absolute;
            top: 75px;  /* Debajo del status */
            left: 20px; /* Alineado a la izquierda */
            display: flex;
            flex-direction: column; /* En columna para que ocupe menos ancho */
            gap: 5px;
            font-size: 0.8rem;
            color: #ccc;
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.3); /* Fondo suave para legibilidad */
            padding: 5px;
            border-radius: 4px;
        }
        
        .stat-highlight {
            color: #0f0;
            font-weight: bold;
        }

        #resetBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: transparent;
            color: #666;
            border: 1px solid #444;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* Asegurar que el botón sea fácil de tocar en móvil */
            min-width: 80px;
            min-height: 40px;
        }

        #resetBtn:hover, #resetBtn:active {
            color: white;
            border-color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #444;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="coords">PARCELA [0, 0]</div>
        <div id="status">Esperando configuración...</div>
        
        <div id="player-stats">
            <div>Mundo: <span id="total-online" class="stat-highlight">1</span></div>
            <div>Aquí: <span id="room-online" class="stat-highlight">1</span></div>
        </div>

        <button id="resetBtn" class="interactive">Reiniciar</button>
        <div class="controls-hint">PC: WASD • Móvil: Toca y arrastra</div>
    </div>

    <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =================================================================================
        //  👇👇👇 ¡ASEGÚRATE DE QUE TUS CLAVES SIGAN AQUÍ! 👇👇👇
        // =================================================================================
        
        const firebaseConfig = {
           apiKey: "AIzaSyADx42-3ciE_EofRtFF5P9YG-akjXUAvks",
            authDomain: "multijugador1-a3080.firebaseapp.com",
            projectId: "multijugador1-a3080",
            storageBucket: "multijugador1-a3080.firebasestorage.app",
            messagingSenderId: "748051007106",
            appId: "1:748051007106:web:3fd083d6fed45cba98569b",
        };

        // =================================================================================
        
        const appId = "mi-juego-mmo-v1"; 

        // Inicialización segura de Firebase
        let app, auth, db;
        const statusDisplay = document.getElementById('status');
        const totalOnlineDisplay = document.getElementById('total-online');
        const roomOnlineDisplay = document.getElementById('room-online');

        try {
            if (firebaseConfig.apiKey === "TU_API_KEY_AQUI" || !firebaseConfig.apiKey) {
                console.warn("⚠️ AVISO: Aún no has puesto tus claves de Firebase.");
                statusDisplay.innerText = "Falta Configuración (Edita el código)";
                statusDisplay.style.color = "orange";
            } else {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) {
            console.warn("Error iniciando Firebase:", e);
            statusDisplay.innerText = "Error Configuración";
        }

        // --- Variables del Juego ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const coordsDisplay = document.getElementById('coords');
        
        const PLAYER_SIZE = 20;
        const SPEED = 5;
        const MAP_SIZE = 16;
        
        const finalBgImage = new Image();
        finalBgImage.src = "https://i.pinimg.com/1200x/c9/e3/db/c9e3db61df66fb2b052e7e6bd479f247.jpg";

        let player = {
            x: window.innerWidth / 2 - 10,
            y: window.innerHeight / 2 - 10,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            color: 'white',
            dx: 0,
            dy: 0,
            id: null,
            networkColor: 'white'
        };

        let mapX = 0;
        let mapY = 0;
        let obstacles = [];
        let otherPlayers = {}; 
        let lastUpdate = 0;

        const keys = { w: false, a: false, s: false, d: false };

        // --- Variables del Joystick Flotante ---
        const joystick = {
            active: false,
            originX: 0,
            originY: 0,
            currentX: 0,
            currentY: 0,
            touchId: null,
            maxRadius: 50 // Tamaño del radio del joystick
        };

        // --- Lógica de Autenticación y Multijugador ---
        
        async function initGame() {
            if (!auth) return;
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Error de autenticación:", error);
                statusDisplay.innerText = "Error Auth (Habilita 'Anónimo' en Firebase Console)";
            }
        }

        if (auth) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    player.id = user.uid;
                    const randomColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    player.networkColor = randomColor; 
                    
                    statusDisplay.innerText = "● Conectado";
                    statusDisplay.style.color = "#0f0";

                    const playersRef = collection(db, 'juegos', appId, 'players');
                    
                    onSnapshot(playersRef, (snapshot) => {
                        const now = Date.now();
                        let totalCount = 0;
                        let roomCount = 1;

                        snapshot.docChanges().forEach((change) => {
                            const data = change.doc.data();
                            const pid = change.doc.id;
                            
                            if (pid === player.id) return; 

                            if (change.type === "added" || change.type === "modified") {
                                otherPlayers[pid] = data;
                            }
                            if (change.type === "removed") {
                                delete otherPlayers[pid];
                            }
                        });

                        Object.keys(otherPlayers).forEach(pid => {
                            const p = otherPlayers[pid];
                            if (now - p.lastSeen < 120000) {
                                totalCount++;
                                if (p.mapX === mapX && p.mapY === mapY) {
                                    roomCount++;
                                }
                            }
                        });

                        totalOnlineDisplay.innerText = totalCount + 1; 
                        roomOnlineDisplay.innerText = roomCount;

                    }, (error) => {
                        console.error("Error recibiendo datos:", error);
                    });

                    window.addEventListener('beforeunload', () => {
                       const myDoc = doc(db, 'juegos', appId, 'players', player.id);
                       deleteDoc(myDoc); 
                    });

                } else {
                    statusDisplay.innerText = "Desconectado";
                    statusDisplay.style.color = "#888";
                }
            });
        }

        function broadcastPosition() {
            if (!player.id || !db) return;
            
            const now = Date.now();
            if (now - lastUpdate > 50) { 
                const myDoc = doc(db, 'juegos', appId, 'players', player.id);
                setDoc(myDoc, {
                    x: Math.round(player.x),
                    y: Math.round(player.y),
                    mapX: mapX,
                    mapY: mapY,
                    color: player.networkColor,
                    lastSeen: now
                }).catch(e => console.error("Error enviando pos:", e));
                lastUpdate = now;
            }
        }

        // --- Lógica del Juego ---

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (player.x > canvas.width) player.x = canvas.width - player.width;
            if (player.y > canvas.height) player.y = canvas.height - player.height;
            changeRoom(); 
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.getElementById('resetBtn').addEventListener('click', () => {
            mapX = 0; mapY = 0;
            player.x = canvas.width / 2 - PLAYER_SIZE / 2;
            player.y = canvas.height / 2 - PLAYER_SIZE / 2;
            changeRoom();
            document.getElementById('resetBtn').blur();
        });

        // Controles de Teclado (PC)
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        // --- Controles Táctiles (Joystick Flotante) ---
        
        window.addEventListener('touchstart', (e) => {
            // Si ya hay un joystick activo o se toca el botón de reinicio, ignorar
            if (joystick.active || e.target.id === 'resetBtn') return;

            const touch = e.changedTouches[0];
            joystick.active = true;
            joystick.touchId = touch.identifier;
            joystick.originX = touch.clientX;
            joystick.originY = touch.clientY;
            joystick.currentX = touch.clientX;
            joystick.currentY = touch.clientY;
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            e.preventDefault(); // Evitar scroll al arrastrar

            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystick.touchId) {
                    const touch = e.changedTouches[i];
                    joystick.currentX = touch.clientX;
                    joystick.currentY = touch.clientY;
                    break;
                }
            }
        }, { passive: false });

        const endTouch = (e) => {
            if (!joystick.active) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystick.touchId) {
                    joystick.active = false;
                    player.dx = 0;
                    player.dy = 0;
                    break;
                }
            }
        };

        window.addEventListener('touchend', endTouch);
        window.addEventListener('touchcancel', endTouch);

        function pseudoRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function generateRoom(mx, my) {
            const roomObstacles = [];
            let seed = mx * 100 + my * 1000 + 12345; 
            if (mx === 15 && my === 15) return []; 
            
            const numObstacles = Math.floor(pseudoRandom(seed++) * 10) + 5;
            for (let i = 0; i < numObstacles; i++) {
                const w = Math.floor(pseudoRandom(seed++) * 100) + 40;
                const h = Math.floor(pseudoRandom(seed++) * 100) + 40;
                const x = Math.floor(pseudoRandom(seed++) * (canvas.width - w));
                const y = Math.floor(pseudoRandom(seed++) * (canvas.height - h));
                
                const safeZoneSize = 150;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const inCenter = (x + w > centerX - safeZoneSize && x < centerX + safeZoneSize &&
                                  y + h > centerY - safeZoneSize && y < centerY + safeZoneSize);
                const inDoorX = (y + h > centerY - 50 && y < centerY + 50); 
                const inDoorY = (x + w > centerX - 50 && x < centerX + 50); 

                if (!inCenter && !inDoorX && !inDoorY) {
                    roomObstacles.push({ x, y, width: w, height: h });
                }
            }
            return roomObstacles;
        }

        function checkCollision(rect1, rect2) {
            return (rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y);
        }

        function update() {
            let moved = false;
            
            // 1. Prioridad: Joystick Táctil
            if (joystick.active) {
                const dx = joystick.currentX - joystick.originX;
                const dy = joystick.currentY - joystick.originY;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance > 0) {
                    const angle = Math.atan2(dy, dx);
                    // Normalizar velocidad, pero permitir movimientos lentos si se mueve poco el dedo
                    const speedMultiplier = Math.min(distance / joystick.maxRadius, 1); 
                    
                    player.dx = Math.cos(angle) * SPEED * speedMultiplier;
                    player.dy = Math.sin(angle) * SPEED * speedMultiplier;
                    moved = true;
                } else {
                    player.dx = 0;
                    player.dy = 0;
                }
            } 
            // 2. Fallback: Teclado (WASD)
            else {
                if (keys.w) { player.dy = -SPEED; moved = true; }
                else if (keys.s) { player.dy = SPEED; moved = true; }
                else player.dy = 0;

                if (keys.a) { player.dx = -SPEED; moved = true; }
                else if (keys.d) { player.dx = SPEED; moved = true; }
                else player.dx = 0;
            }

            // FÍSICA Y COLISIONES
            let nextX = player.x + player.dx;
            let collisionX = false;
            for (let obs of obstacles) {
                if (checkCollision({x: nextX, y: player.y, width: player.width, height: player.height}, obs)) {
                    collisionX = true; break;
                }
            }
            if (!collisionX) player.x = nextX;

            let nextY = player.y + player.dy;
            let collisionY = false;
            for (let obs of obstacles) {
                if (checkCollision({x: player.x, y: nextY, width: player.width, height: player.height}, obs)) {
                    collisionY = true; break;
                }
            }
            if (!collisionY) player.y = nextY;

            // TRANSICIÓN DE PANTALLAS
            let changedScreen = false;
            if (player.x > canvas.width) {
                if (mapX < MAP_SIZE - 1) { mapX++; player.x = 0; changedScreen = true; } 
                else { player.x = canvas.width - player.width; }
            }
            else if (player.x + player.width < 0) {
                if (mapX > 0) { mapX--; player.x = canvas.width - player.width; changedScreen = true; } 
                else { player.x = 0; }
            }
            else if (player.y > canvas.height) {
                if (mapY < MAP_SIZE - 1) { mapY++; player.y = 0; changedScreen = true; } 
                else { player.y = canvas.height - player.height; }
            }
            else if (player.y + player.height < 0) {
                if (mapY > 0) { mapY--; player.y = canvas.height - player.height; changedScreen = true; } 
                else { player.y = 0; }
            }

            if (changedScreen) changeRoom();

            if (moved || changedScreen) {
                broadcastPosition();
            }
        }

        function changeRoom() {
            obstacles = generateRoom(mapX, mapY);
            coordsDisplay.innerText = `PARCELA [${mapX}, ${mapY}]`;
            coordsDisplay.style.color = '#fff';
            coordsDisplay.style.textShadow = '0 0 10px white';
            setTimeout(() => {
                coordsDisplay.style.color = '#0f0';
                coordsDisplay.style.textShadow = '0 0 5px rgba(0, 255, 0, 0.5)';
            }, 300);
            
            broadcastPosition();
            if(roomOnlineDisplay) roomOnlineDisplay.innerText = "Calculando..."; 
        }

        function draw() {
            // Fondo
            if (mapX === 15 && mapY === 15 && finalBgImage.complete) {
                ctx.drawImage(finalBgImage, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 1;
                const gridSize = 100;
                const offsetX = (canvas.width % gridSize) / 2;
                const offsetY = (canvas.height % gridSize) / 2;
                for(let i=offsetX; i<canvas.width; i+=gridSize) {
                    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke();
                }
                for(let i=offsetY; i<canvas.height; i+=gridSize) {
                    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width, i); ctx.stroke();
                }
            }

            // Obstáculos
            if (mapX === 15 && mapY === 15) {
                ctx.fillStyle = '#000'; 
                ctx.strokeStyle = '#00ff00';
            } else {
                ctx.fillStyle = '#222';
                ctx.strokeStyle = '#333';
            }
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            }

            // Meta
            if (mapX === 15 && mapY === 15) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(canvas.width/2 - 40, canvas.height/2 - 15, 80, 30);
                ctx.fillStyle = '#00ff00';
                ctx.font = 'bold 16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("META", canvas.width/2, canvas.height/2 + 5);
            }

            // Otros jugadores
            const currentTime = Date.now();
            Object.keys(otherPlayers).forEach(pid => {
                const p = otherPlayers[pid];
                if (p.mapX === mapX && p.mapY === mapY && (currentTime - p.lastSeen < 120000)) {
                    ctx.fillStyle = p.color || 'red';
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = p.color || 'red';
                    ctx.fillRect(p.x, p.y, PLAYER_SIZE, PLAYER_SIZE);
                }
            });

            // Jugador local
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0; 
            
            // DIBUJAR JOYSTICK (Si está activo)
            if (joystick.active) {
                ctx.lineWidth = 2;
                
                // Base del joystick
                ctx.beginPath();
                ctx.arc(joystick.originX, joystick.originY, joystick.maxRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fill();

                // Palanca (Stick)
                // Calcular posición limitada al radio
                const dx = joystick.currentX - joystick.originX;
                const dy = joystick.currentY - joystick.originY;
                const distance = Math.sqrt(dx*dx + dy*dy);
                let stickX = joystick.currentX;
                let stickY = joystick.currentY;

                if (distance > joystick.maxRadius) {
                    const angle = Math.atan2(dy, dx);
                    stickX = joystick.originX + Math.cos(angle) * joystick.maxRadius;
                    stickY = joystick.originY + Math.sin(angle) * joystick.maxRadius;
                }

                ctx.beginPath();
                ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        changeRoom();
        gameLoop();

    </script>
</body>
</html>
